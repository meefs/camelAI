nodeLinker: pnp

# Store cache locally in .yarn/cache for portability
enableGlobalCache: false

# Use bundled Yarn Berry (avoid falling back to global yarn v1)
yarnPath: .yarn/releases/yarn-4.6.0.cjs

# Use local Verdaccio registry for wrangler (during Docker build)
npmRegistryServer: "http://localhost:4873"
unsafeHttpWhitelist:
  - "localhost"
