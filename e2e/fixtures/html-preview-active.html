<!doctype html>
<html lang="en">
  <body>
    <script>
      const bootId =
        typeof crypto !== 'undefined' && crypto.randomUUID
          ? crypto.randomUUID()
          : String(Math.random());
      let tickCount = 0;

      parent.postMessage(
        { type: 'html-preview-fixture', name: 'active', event: 'boot', bootId },
        '*',
      );

      function tick() {
        tickCount += 1;
        parent.postMessage(
          {
            type: 'html-preview-fixture',
            name: 'active',
            event: 'tick',
            bootId,
            tick: tickCount,
          },
          '*',
        );
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
