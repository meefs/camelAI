name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:all

  deploy-sandbox-image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:renderer

      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/heads/main)
              echo "host_ip=172.206.70.242" >> "$GITHUB_OUTPUT"
              echo "acr_name=crchiridionstaging" >> "$GITHUB_OUTPUT"
              echo "acr_login_server=crchiridionstaging.azurecr.io" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/production)
              echo "host_ip=20.46.233.68" >> "$GITHUB_OUTPUT"
              echo "acr_name=crchiridionprod" >> "$GITHUB_OUTPUT"
              echo "acr_login_server=crchiridionprod.azurecr.io" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deploy branch: ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SANDBOX_GO_DEPLOY_SSH_KEY }}" > ~/.ssh/sandbox_go_deploy
          chmod 600 ~/.ssh/sandbox_go_deploy
          printf '%s\n' "${{ secrets.SANDBOX_GO_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host sandbox-image-deploy
            HostName ${{ steps.target.outputs.host_ip }}
            User chiridion
            IdentityFile ~/.ssh/sandbox_go_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH
        run: ssh sandbox-image-deploy 'whoami && hostname'

      - name: Rsync sandbox files to VM
        run: |
          rsync -az --delete \
            sandbox/ \
            sandbox-image-deploy:/opt/chiridion/sandbox/
          rsync -az \
            services/sandbox-host/Dockerfile.sandbox \
            sandbox-image-deploy:/opt/chiridion/Dockerfile.sandbox

      - name: Build and push image to ACR
        run: |
          ssh sandbox-image-deploy '
            cd /opt/chiridion &&
            sudo docker build -t chiridion-sandbox:latest -f Dockerfile.sandbox . &&
            sudo az acr login --name ${{ steps.target.outputs.acr_name }} &&
            sudo docker tag chiridion-sandbox:latest ${{ steps.target.outputs.acr_login_server }}/chiridion-sandbox:latest &&
            sudo docker push ${{ steps.target.outputs.acr_login_server }}/chiridion-sandbox:latest
          '
