name: E2E

# Fully local + deterministic: boots the app with LOCAL_AUTH_BYPASS (no signup
# form) and the fake LLM (scripts/fake-llm.mjs, no real model / no credentials),
# then runs the bypass-native specs. No staging, no secrets needed to run — so it
# can gate PRs. The merged HTML report (with videos) is published to the viewer
# at e2e-reports.camelai.dev.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Dummy dev vars for the local bypass boot
        # Not real secrets — just non-empty values so the bypass session can be
        # signed locally. LOCAL_AUTH_BYPASS + the fake LLM mean no real creds are
        # needed. playwright.config (E2E_LOCAL) boots the app + fake LLM.
        run: |
          {
            echo "TOKEN_SIGNING_SECRET=ci-e2e-local-dummy-token-signing-secret"
            echo "INTEGRATION_SECRET_KEY=ci-e2e-local-dummy-integration-secret-key"
          } > .dev.vars
      - name: Run local E2E
        run: bun run test:e2e
        env:
          E2E_LOCAL: '1'
          PW_VIDEO: on
          # Pin the stock egress interceptor for CI. workerd unconditionally
          # `docker pull`s this image, so local-only tags are not usable here.
          # Keep the tag in sync with miniflare's
          # DEFAULT_CONTAINER_EGRESS_INTERCEPTOR_IMAGE.
          MINIFLARE_CONTAINER_EGRESS_IMAGE: cloudflare/proxy-everything:3cb1195@sha256:0ef6716c52430096900b150d84a3302057d6cd2319dae7987128c85d0733e3c8
      - name: Upload HTML report (artifact)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Publish report to the viewer (e2e-reports.camelai.dev)
        if: ${{ !cancelled() && env.UPLOAD_TOKEN != '' }}
        env:
          UPLOAD_TOKEN: ${{ secrets.E2E_REPORT_UPLOAD_TOKEN }}
        run: |
          run_dir="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd playwright-report
          find . -type f | sed 's|^\./||' | while read -r f; do
            curl -fsS -X PUT "https://e2e-reports.camelai.dev/upload/${run_dir}/${f}" \
              -H "Authorization: Bearer ${UPLOAD_TOKEN}" \
              --data-binary "@${f}" -o /dev/null
          done
          echo "### E2E report" >> "$GITHUB_STEP_SUMMARY"
          echo "[View report](https://e2e-reports.camelai.dev/r/${run_dir}/)" >> "$GITHUB_STEP_SUMMARY"

# Only repo secret used: E2E_REPORT_UPLOAD_TOKEN (publishes the report to the
# viewer; the run itself needs no secrets).
